name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_NO_CACHE_DIR: 1

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      
      - name: Build macOS app
        run: pyinstaller sperm_counter_onnx.spec --noconfirm
      
      - name: Create DMG
        run: hdiutil create -volname SpermCounter -srcfolder dist/SpermCounter.app -ov -format UDZO SpermCounter-macOS.dmg
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpermCounter-macOS
          path: SpermCounter-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      
      - name: Build Windows exe
        run: pyinstaller sperm_counter_windows.spec --clean --noconfirm
      
      - name: Create ZIP
        run: Compress-Archive -Path dist\SpermCounter -DestinationPath SpermCounter-Windows.zip
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpermCounter-Windows
          path: SpermCounter-Windows.zip

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4.1.8
        with:
          name: SpermCounter-macOS
      
      - uses: actions/download-artifact@v4.1.8
        with:
          name: SpermCounter-Windows
      
      - name: Create Release
        uses: softprops/action-gh-release@v2.0.9
        with:
          files: |
            SpermCounter-macOS.dmg
            SpermCounter-Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
