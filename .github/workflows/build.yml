name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PIP_NO_CACHE_DIR: 1

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4.2.2
      
      - name: Set up Python
        uses: actions/setup-python@v5.2.0
        with: { python-version: '3.11' }
      
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      
      - name: Build macOS app
        run: pyinstaller sperm_counter.spec --clean --noconfirm
      
      - name: List dist directory
        run: ls -la dist/
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4.3.4
        with: { name: SpermCounter-macOS, path: dist/SpermCounter.app }

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
      
      - name: Set up Python
        uses: actions/setup-python@v5.2.0
        with: { python-version: '3.11' }
      
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      
      - name: Build Windows exe
        run: pyinstaller sperm_counter.spec --clean --noconfirm
      
      - name: List dist directory
        run: dir dist
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4.3.4
        with: { name: SpermCounter-Windows, path: dist/SpermCounter.exe }

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4.1.8
        with: { name: SpermCounter-macOS, path: ./artifacts }
      - uses: actions/download-artifact@v4.1.8
        with: { name: SpermCounter-Windows, path: ./artifacts }
      
      - name: Create Release
        uses: softprops/action-gh-release@v2.0.9
        with:
          files: |
            artifacts/SpermCounter.app
            artifacts/SpermCounter.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}